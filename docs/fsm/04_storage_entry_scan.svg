th="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="720.51" y="628.13" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[scan_deg &gt;= 360,</text><text x="720.51" y="641.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">!deposit_rod.detected]</text><text x="720.51" y="654.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">/ Kobuki_Drive(STOP),</text><text x="720.51" y="667.69" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">LED1 red</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 620 279.97 L 807.21 280" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 797.35 285.62 L 808.6 280 L 797.35 274.37" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="715.50" y="267.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text></g></g></g></g><g><g><rect x="20" y="20" width="920" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="43.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="20" fill="rgb(0, 0, 0)" font-weight="bold">3a. Storage: drive in and scan for the rod</text></g></g></g></g><g><g><rect x="20" y="52" width="920" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="66.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(85, 85, 85)">TURN, DRIVE_IN and DEPOSIT (the full-circle scan). Dashed grey boxes are States shown in other pictures; red = fault.</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 20 910 L 980 910 L 990 920 L 990 960 L 20 960 L 20 910 Z" fill="#ffffff" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/><path d="M 980 910 L 980 920 L 990 920" fill="none" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="28.00" y="929.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">DEPOSIT turns anticlockwise through a full circle (scan_deg &gt;= 360) at 50 mm/s and keeps the closest valid echo (not 0, at most DEPOSIT_SCAN_MAX_RANGE_MM) with its gyro heading. With no echo it</text><text x="28.00" y="941.59" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">lights LED1 red and returns to IDLE. TURN ignores bumper and cliff; DRIVE_IN ignores the cliff, and any bumper ends it in DEPOSIT.</text></g></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg>
