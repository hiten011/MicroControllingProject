ks, then 3 readings</text><text x="630.00" y="697.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(107, 107, 107)" font-style="italic">// 5 Ticks apart; the median is kept</text></g></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 680.02 200 L 680 144.79" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 685.63 154.65 L 680 143.4 L 674.38 154.65" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="729.50" y="173.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text></g></g></g></g><g><g><path d="M 215 304 L 215 380.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 209.25 370.82 L 215 382.32 L 220.75 370.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="281.51" y="333.72" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[scan_deg &gt;= 360,</text><text x="281.50" y="346.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">deposit_rod.detected]</text><text x="281.51" y="360.09" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">/ Kobuki_Drive(STOP)</text></g></g></g></g><g><g><path d="M 215 492 L 215 578.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 209.25 568.82 L 215 580.32 L 220.75 568.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="281.51" y="526.72" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[deposit_refined &amp;&amp;</text><text x="281.51" y="539.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">|turn| &lt;= 50]</text><text x="281.51" y="553.09" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">/ Kobuki_Drive(STOP)</text></g></g></g></g><g><g><path d="M 370 414 L 616.65 414" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 606.82 419.75 L 618.32 414 L 606.82 408.25" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="495.51" y="362.13" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[!deposit_refined &amp;&amp;</text><text x="495.51" y="375.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">|turn| &lt;= 100]</text><text x="495.51" y="388.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">/ Kobuki_Drive(STOP),</text><text x="495.51" y="401.69" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">Deposit_Refine_Start()</text></g></g></g></g><g><g><path d="M 890.01 461 L 890.01 577.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 884.26 567.82 L 890.01 579.32 L 895.76 567.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="933.51" y="523.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[|turn| &lt;= 50]</text></g></g></g></g><g><g><path d="M 679.99 581 L 679.99 464.35" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 685.74 474.18 L 679.99 462.68 L 674.24 474.18" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="758.49" y="517.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[Deposit_Refine_Sample()</text><text x="758.50" y="530.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&amp;&amp; Deposit_Refine_Next()]</text></g></g></g></g><g><g><path d="M 620 642 L 455 642 L 455 469 L 373.35 469" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 383.18 463.25 L 371.68 469 L 383.18 474.75" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="536.51" y="544.72" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[Deposit_Refine_Sample()</text><text x="536.50" y="557.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&amp;&amp; !Deposit_Refine_Next()</text><text x="536.51" y="571.09" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&amp;&amp; Deposit_Refine_Finish()]</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 930 670 L 1000 670 L 1000 144.8" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1005.63 154.65 L 1000 143.4 L 994.38 154.65" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="917.49" y="273.13" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">[Deposit_Refine_Sample()</text><text x="917.50" y="286.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">&amp;&amp; !Deposit_Refine_Next()</text><text x="917.50" y="299.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">&amp;&amp; !Deposit_Refine_Finish()]</text><text x="917.50" y="312.69" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">/ LED1 red</text></g></g></g></g><g><g><rect x="20" y="20" width="1030" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="43.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="20" fill="rgb(0, 0, 0)" font-weight="bold">3b. Storage: align to the rod and refine the heading</text></g></g></g></g><g><g><rect x="20" y="52" width="1030" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="66.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(85, 85, 85)">DEPOSIT_ALIGN and the refine sweep (DEPOSIT_REFINE_TURN / DEPOSIT_REFINE_SAMPLE). Dashed grey boxes are States shown in other pictures; red = fault.</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 20 760 L 1040 760 L 1050 770 L 1050 818 L 20 818 L 20 760 Z" fill="#ffffff" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/><path d="M 1040 760 L 1040 770 L 1050 770" fill="none" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="28.00" y="779.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">DEPOSIT_ALIGN turns the short way to the saved heading. The first time, within 100 ticks, it starts the refine sweep; once the heading is refined, within 50 ticks, it goes to DEPOSIT_DISTANCE. The sweep visits 26</text><text x="28.00" y="791.59" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">headings from -25 to +25 deg around the coarse heading, 2 deg apart. DEPOSIT_REFINE_TURN turns to a step at 35 mm/s; DEPOSIT_REFINE_SAMPLE stops, waits 15 Ticks, takes 3 readings 5 Ticks apart and</text><text x="28.00" y="804.19" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">keeps the median. After the last step, the centre of the widest run of steps within 10 mm of the closest median becomes the heading (ties: nearest the coarse heading). No valid median faults with LED1 red.</text></g></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg>
