><text x="214.99" y="603.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="12" fill="rgb(85, 85, 85)" font-weight="bold">DEPOSIT_DISTANCE</text><text x="215.00" y="614.70" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="10" fill="rgb(85, 85, 85)">(DISTANCE ADJUST, picture 06)</text></g></g></g></g><g><g><path d="M 930 393 L 930 373 Q 930 367 924 367 L 626 367 Q 620 367 620 373 L 620 393" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/><path d="M 620 393 L 620 455 Q 620 461 626 461 L 924 461 Q 930 461 930 455 L 930 393" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/><path d="M 620 393 L 930 393" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="775.00" y="384.70" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="13" fill="rgb(0, 0, 0)" font-weight="bold">DEPOSIT_REFINE_TURN</text></g></g></g><g><g><rect x="620" y="393" width="310" height="68" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="630.00" y="413.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(0, 0, 0)" font-weight="bold">do /</text><text x="656.41" y="413.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(0, 0, 0)"> turn = Deposit_Refine_Turn_Ticks()</text><text x="630.00" y="427.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(0, 0, 0)">Kobuki_Rotate(sign(turn) * 35)</text><text x="630.00" y="441.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(107, 107, 107)" font-style="italic">// to the next of 26 steps,</text><text x="630.00" y="455.00" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(107, 107, 107)" font-style=