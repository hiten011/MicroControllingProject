="480.51" y="508.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[deposit_range_mm</text><text x="480.51" y="521.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&lt;= 420]</text></g></g></g></g><g><g><path d="M 390 620 L 596.65 620" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 586.82 625.75 L 598.32 620 L 586.82 614.25" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="495.51" y="595.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[deposit_range_mm</text><text x="495.51" y="608.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&lt; 400]</text></g></g></g></g><g><g><path d="M 600 638 L 393.35 638" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 403.18 632.25 L 391.68 638 L 403.18 643.75" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="495.51" y="655.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[deposit_range_mm</text><text x="495.51" y="668.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&gt;= 510]</text></g></g></g></g><g><g><path d="M 235 642 L 235 806.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 229.25 796.82 L 235 808.32 L 240.75 796.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="314.51" y="659.13" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">[400 &lt;= deposit_range_mm</text><text x="314.51" y="672.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">&lt;= 420]</text><text x="314.50" y="685.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">/ LED1 green,</text><text x="314.51" y="698.69" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">Win_Sound_Start()</text></g></g></g></g><g><g><rect x="20" y="20" width="950" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="43.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="20" fill="rgb(0, 0, 0)" font-weight="bold">3c. Storage: adjust the distance to the rod</text></g></g></g></g><g><g><rect x="20" y="52" width="950" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="66.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(85, 85, 85)">DEPOSIT_DISTANCE, DEPOSIT_REVERSE and DEPOSIT_APPROACH. Dashed grey boxes are States shown in other pictures; red = fault.</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 20 880 L 960 880 L 970 890 L 970 938 L 20 938 L 20 880 Z" fill="#ffffff" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/><path d="M 960 880 L 960 890 L 970 890" fill="none" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="28.00" y="899.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">DEPOSIT_DISTANCE holds still for 15 Ticks (about 300 ms) so the 10 Hz sonar catches up, then reads deposit_range_mm against the target 410 mm +/- 10 mm: too close backs off in</text><text x="28.00" y="911.59" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">DEPOSIT_REVERSE until 510 mm (a 100 mm margin) at 50 mm/s, too far creeps in DEPOSIT_APPROACH at 35 mm/s until 420 mm, so the last correction is always made moving forward. Inside the</text><text x="28.00" y="924.19" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">band it lights LED1 green, starts the win sound and returns to IDLE. All three States also fault on any bumper or cliff, or on a zero or maximum-range reading.</text></g></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg>
