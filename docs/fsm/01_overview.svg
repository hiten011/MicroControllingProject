<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1002px" height="1073px" viewBox="0 0 1002 1073"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0"/><g><g><g><g><g><rect x="240" y="150" width="330" height="100" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="404.99" y="178.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">IDLE</text><text x="405.00" y="203.98" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">waits for B0 (start button).</text><text x="405.00" y="217.17" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">Leaving it resets the run.</text></g></g></g></g><g><g><rect x="240" y="320" width="330" height="100" rx="6" ry="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="404.98" y="348.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">SEARCH phase</text><text x="404.99" y="373.98" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">SEARCH · IDENTIFY</text><text x="404.99" y="387.17" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)" font-style="italic">spin, find the bollard, learn Layout A / B</text></g></g></g></g><g><g><rect x="240" y="490" width="330" height="100" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="404.99" y="518.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">ORIENT</text><text x="405.00" y="543.98" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">turn to the corridor: A -75°, B +108°</text><text x="405.00" y="557.17" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)" font-style="italic">heading is saved</text></g></g></g></g><g><g><rect x="240" y="660" width="330" height="100" rx="6" ry="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="404.99" y="688.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">PATHFIND</text><text x="404.99" y="713.98" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">DRIVE · REVERSE · ROTATE</text><text x="404.99" y="727.17" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">CORRIDOR_REVERSE · CORRIDOR_TURN</text><text x="404.99" y="740.36" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">CORRIDOR_STOP</text></g></g></g></g><g><g><rect x="240" y="830" width="330" height="100" rx="6" ry="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="404.99" y="858.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">STORAGE</text><text x="405.00" y="883.98" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">TURN · DRIVE_IN · DEPOSIT</text><text x="405.00" y="897.17" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">DEPOSIT_ALIGN · DEPOSIT_REFINE_*</text><text x="405.00" y="910.36" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">DEPOSIT_DISTANCE / _REVERSE / _APPROACH</text></g></g></g></g><g><g><ellipse cx="405" cy="114" rx="8" ry="8" fill="#000000" stroke="#000000" stroke-width="1.5" pointer-events="all"/></g></g><g><g><rect x="770" y="320" width="210" height="600" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" pointer-events="all"/></g><g><g><g><text x="874.99" y="348.00" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="14" fill="rgb(0, 0, 0)" font-weight="bold">STOP / FAULT</text><text x="797.55" y="360.80" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)" font-weight="bold">entry /</text><text x="833.63" y="360.80" text-anchor="start" xml:space="preserve" font-family="Courier New" font-size="11" fill="rgb(0, 0, 0)">Kobuki_Drive(STOP)</text></g></g></g></g><g><g><path d="M 405 122 L 405 146.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 399.25 136.82 L 405 148.32 L 410.75 136.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g><g><path d="M 405 250 L 405 316.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 399.25 306.82 L 405 318.32 L 410.75 306.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="424.50" y="287.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">B0</text></g></g></g></g><g><g><path d="M 405 420 L 405 486.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 399.25 476.82 L 405 488.32 L 410.75 476.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="456.50" y="444.72" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">object found;</text><text x="456.50" y="457.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">IDENTIFY picks</text><text x="456.50" y="471.09" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">Layout A / B</text></g></g></g></g><g><g><path d="M 405 590 L 405 656.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 399.25 646.82 L 405 658.32 L 410.75 646.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="453.49" y="621.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">turn done;</text><text x="453.50" y="634.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">heading saved</text></g></g></g></g><g><g><path d="M 405 760 L 405 826.65" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 399.25 816.82 L 405 828.32 L 410.75 816.82" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="452.50" y="791.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">2nd front cliff</text><text x="452.51" y="804.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">(corridor == 2)</text></g></g></g></g><g><g><path d="M 240 880 L 210 880 L 210 200 L 236.65 200" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 226.82 205.75 L 238.32 200 L 226.82 194.25" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="122.51" y="536.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">done: LED1 green + win sound</text><text x="122.50" y="549.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">(or no rod found: LED1 red)</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 570 370 L 767.21 369.98" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 757.35 375.61 L 768.6 369.98 L 757.35 364.36" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="670.50" y="344.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text><text x="670.49" y="357.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">| bumper | cliff</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 570 540 L 767.21 540.02" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 757.35 545.64 L 768.6 540.02 L 757.35 534.39" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="670.50" y="515.31" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text><text x="670.49" y="528.50" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">| bumper | cliff</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 570 710 L 767.2 710" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 757.35 715.63 L 768.6 710 L 757.35 704.38" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="670.50" y="697.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 570 880 L 767.21 879.98" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 757.35 885.61 L 768.6 879.98 L 757.35 874.36" fill="none" stroke="#b85450" stroke-width="1.25" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="670.50" y="867.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(184, 84, 80)">B1 | wheeldrop</text></g></g></g></g><g><g><path d="M 875 320 L 875 200 L 573.35 200" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 583.18 194.25 L 571.68 200 L 583.18 205.75" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="722.51" y="187.91" text-anchor="middle" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(0, 0, 0)">ε (next Tick)</text></g></g></g></g><g><g><rect x="20" y="20" width="920" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="43.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="20" fill="rgb(0, 0, 0)" font-weight="bold">AMU parcel-run FSM: the big picture</text></g></g></g></g><g><g><rect x="20" y="52" width="920" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g><g><text x="20.00" y="66.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="11" fill="rgb(85, 85, 85)">Phases only. Arrows are the main path; red arrows are faults. The next pictures zoom into each phase, one State per box, in the same notation.</text></g></g></g></g><g><g transform="translate(0.5,0.5)"><path d="M 20 980 L 970 980 L 980 990 L 980 1052 L 20 1052 L 20 980 Z" fill="#ffffff" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/><path d="M 970 980 L 970 990 L 980 990" fill="none" stroke="#808080" stroke-miterlimit="10" pointer-events="all"/></g><g><g><g><text x="28.00" y="999.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)" font-weight="bold">Detailed pictures</text><text x="112.63" y="999.00" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)"> 02_search_orient: IDLE, SEARCH, IDENTIFY, ORIENT · 03_pathfind: DRIVE, REVERSE, ROTATE, CORRIDOR_* · 04_storage: TURN, DRIVE_IN, DEPOSIT, DEPOSIT_ALIGN,</text><text x="28.00" y="1011.59" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">DEPOSIT_REFINE_TURN / _SAMPLE, DEPOSIT_DISTANCE / _REVERSE / _APPROACH.</text><text x="28.00" y="1024.19" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)" font-weight="bold">Faults</text><text x="58.92" y="1024.19" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)"> B1 | wheeldrop leaves every State except IDLE and STOP / FAULT. STOP / FAULT stops the motors and returns to IDLE on the next Tick. PATHFIND and most of STORAGE expect bumpers and</text><text x="28.00" y="1036.78" text-anchor="start" xml:space="preserve" font-family="Helvetica" font-size="10.5" fill="rgb(68, 68, 68)">cliffs, so they fault on B1 | wheeldrop only; the three DISTANCE ADJUST States also fault on any bumper or cliff.</text></g></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg>
